---
- name: Install Nginx on Ubuntu
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: ansible_distribution == "Ubuntu"

- name: Install Nginx on Amazon Linux
  ansible.builtin.dnf:
    name: nginx
    state: present
  when: ansible_distribution == "Amazon"

- name: Deploy Nginx configuration on Ubuntu
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/ansible-demo.conf
    mode: '0644'
  when: ansible_distribution == "Ubuntu"
  notify: Reload Nginx

- name: Deploy Nginx configuration on Amazon Linux
  ansible.builtin.template:
    src: nginx-amazon.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  when: ansible_distribution == "Amazon"
  notify: Reload Nginx

- name: Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
